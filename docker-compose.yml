services:
  dev:
    profiles:
      - dev
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev -- --host 0.0.0.0 --port 5173

  preview:
    profiles:
      - preview
    build:
      context: .
      target: preview
    ports:
      - "4173:4173"
    command: npm run preview -- --host 0.0.0.0 --port 4173

volumes:
  node_modules:
